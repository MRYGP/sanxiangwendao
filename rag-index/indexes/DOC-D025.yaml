key_insight_v11: "懂与改是同一认知动力学的两端:懂=水流第一次走通一条路(瞬间),改=那条路被反复冲成永久河道(数月)。这解释了核心命题'道理你都懂为什么改不了'——一次走过不等于永久河道。同时,'为什么需要例子才能懂'早被Gentner结构映射、皮亚杰同化顺应、Sweller样例效应、具身认知、Paivio双重编码解释过;流变学的独特贡献不是解释'懂',而是把'懂'和'改'连进同一根时间轴。"
future_extensions_v12_seeds:
  - seed_1_river_network: "认知结构是河网而非单条河,水流在多条河床间切换,旧河床休眠而非消失。解释:兴趣转换、重启vs创新、个体差异。已有理论:联结主义、激活扩散(Collins & Loftus 1975),但未连接到流体动力学时间累积层面。"
  - seed_2_segment_heterogeneity: "同一条河上不同段落深浅宽窄不同。解释:专家盲点、领域内卡住vs心流、刻意练习机制(为浅段引水)。已有理论:专家研究(Ericsson)、概念图密度,但未用同一套动力学整合'不均匀如何形成与干预'。"
  - meta_seed_connection_theory: "松阳的发现模式:在所有人都研究过的现象里找没人连接的两端。已有3个样本(河道比喻、懂≠改、河网+异质)。未来可成元方法论文档《连接论:为什么真知识在已知与已知之间》。"
