  以《洞见》中电锯噪音冥想案例说明：痛苦来自对刺激的标签而非刺激本身。
  阐释多巴胺耐受如何让现代人陷入"强刺激依赖"（烟、短视频、购物），并与抑郁/焦虑共享
  "不适→自动判断→寻求外部刺激"的神经回路。提出冥想转化路径：觉察→接纳→耐受不适而不立即反应，
  配合急性期（药物/治疗）、恢复期（治疗+冥想）、维持期（冥想为主）的分层整合方案；
