title: "责任锚点透镜：判断AI公司能不能活"
summary: |
  LLM 吞掉的是可被模型内化的薄壳，能活的 AI 公司靠的不是更聪明而是"责任锚点"——
  AI 出错时有没有明确的人或机构必须埋单。无锚点则付费靠心情，有锚点则付费刚性。
  关键中国转弯：美国锚在个人执照，中国锚在平台/牌照/NMPA 器械分类；以推想医疗等案例说明
  "证解决了责任但没解决支付，活路在责任锚与支付锚绑定同一产品形态"。
  与种树种菜框架互补：判断业务是菜还是树之前，先问出错谁赔钱。
