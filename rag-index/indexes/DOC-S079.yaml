title: "即时反馈回路理论：如何设计驱动内在动机的系统"
summary: |
  对比传统 KPI（月末才知道结果）与美团骑手系统（每单即时到账），揭示"即时反馈回路"驱动持续行为的机制：
  行为→即时可见的价值变化→多巴胺释放→想继续做→再行为。五大要素：价值可量化、反馈即时性、
