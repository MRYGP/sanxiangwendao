title: "解决方案的次生问题定律"
summary: |
  任何产品/方案解决痛点 A 后必然制造次生问题 B，顶级产品思维不是消灭 B，
  而是为 B 找到"自然接盘侠"——系统内已有冗余资源、主动承接 B 并从中获利的参与者。
  从怪兽充电宝定价抱怨升维而来：美团骑手顺路还宝 vs 用户独自承担"归还难"决定商业模式寿命。
